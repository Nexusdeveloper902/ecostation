; ---------------------------------------------------------------------------
; EcoStation — Firmware de la estación de reciclaje (ESP32-CAM)
;
; Entornos:
;   esp32cam   POR DEFECTO. Firmware de la estación: AI-Thinker ESP32-CAM
;              (OV3660) con cámara y lector RC522 a bordo. Captura al pulsar
;              el obturador, subida al servidor, visualizador web y comando
;              de asociación.
;   native     Pruebas unitarias en el host de la lógica pura (sin placa):
;              protocolo HCE, firma de peticiones, cargas, flujo de la
;              estación, dirección del servidor.
; ---------------------------------------------------------------------------

[platformio]
; `pio run` y `pio run -t upload` apuntan a la estación.
default_envs = esp32cam

[env]
monitor_speed = 115200
; Traduce el backtrace de pánico a fichero:línea.
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wextra
    ; SPI del RC522 a 1 MHz en lugar de los 4 MHz por defecto de la librería:
    ; las tramas son de ~60 B, así que la velocidad no aporta nada, mientras
    ; que 4 MHz sobre cables dupont con caídas de tensión corrompe lecturas.
    -DMFRC522_SPICLOCK=1000000u

; --- Estación de reciclaje: ESP32-CAM con cámara y RC522 -------------------
[env:esp32cam]
platform = espressif32
framework = arduino
board = esp32cam
; Obligatorio: el circuito auto-download del AI-Thinker deja el chip en mal
; estado si el puerto serie se abre con DTR/RTS activos.
monitor_dtr = 0
monitor_rts = 0
build_flags =
    ${env.build_flags}
    -DCAMERA_STATION
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    espressif/esp32-camera
    miguelbalboa/MFRC522@^1.4.11

; --- Pruebas unitarias en el host (sin placa) ------------------------------
; No extiende los ajustes arduino de [env] a propósito.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>            ; solo pruebas: src/ necesita Arduino real
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
